---
- name: Install and configure AD authentication
  hosts: all
  become: yes
  become_method: sudo

  vars_prompt:
    - name: "bind_password"
      prompt: "Password for c@<active_directory>"
      private: yes

  tasks:

    - name: Install the EPEL Package RHEL
      yum:
        name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
        state: present
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8'
      environment:
        https_proxy: http://<PROXY_URL>:<PROXY_PORT>

    - name: Install the EPEL Package RHEL
      yum:
        name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
        state: present
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9'
      environment:
        https_proxy: http://<PROXY_URL>:<PROXY_PORT>


    - name: Install the required packages
      yum:
        name: sssd, realmd, oddjob, oddjob-mkhomedir, adcli, samba-common, samba-common-tools, krb5-workstation, openldap-clients, python3-policycoreutils, python3-pip
        state: present

    - name: Install pexpect using pip
      pip:
        name: pexpect
        executable: pip3
      environment:
        https_proxy: http://<PROXY_URL>:<PROXY_PORT>

    - name: Join system to AD and add the computer object in the Linux OU
      expect:
        command: /bin/bash -c '/usr/sbin/realm join --user=<AD_USER> --computer-ou="OU=XXX,OU=XXX,DC=XXX,DC=XXX,DC=XXX" --os-name="Red Hat Enterprise Linux" --os-version="8" --membership-software=adcli <active_directory>'
        responses:
          Password for *: "{{ bind_password }}"
      no_log: true
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8'

    - name: Join system to AD and add the computer object in the Linux OU
      expect:
        command: /bin/bash -c '/usr/sbin/realm join --user=<AD_USER> --computer-ou="OU=XXX,OU=XXX,DC=XXX,DC=XXX,DC=XXX" --os-name="Red Hat Enterprise Linux" --os-version="9" --membership-software=adcli <active_directory>'
        responses:
          Password for *: "{{ bind_password }}"
      no_log: true
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9'

    - name: Add default_domain_suffix to sssd.conf
      lineinfile:
        dest: /etc/sssd/sssd.conf
        line: 'default_domain_suffix = <active_directory>'
        insertafter: '^\[sssd\]'

    - name: Allow the IAM Linux ADMIN AD group to logon to the system
      command: /bin/bash -c "/usr/sbin/realm permit -g LINUX-ALL-SUDO@<active_directory>"

    - name: Add the IAM Linux ADMIN AD group to sudoers
      lineinfile:
        dest: /etc/sudoers
        line: '%LINUX-ALL-SUDO@<active_directory>        ALL=(ALL)       ALL'
        insertafter: '^%wheel'

    - name: Allow the {{ ansible_hostname }} SUDO AD group to logon to the system
      command: /bin/bash -c "/usr/sbin/realm permit -g LINUX-{{ ansible_hostname }}-SUDO@<active_directory>"

    - name: Add the {{ ansible_hostname }} SUDO AD Group to sudoers
      lineinfile:
        dest: /etc/sudoers
        line: '%LINUX-{{ ansible_hostname }}-SUDO@<active_directory>        ALL=(ALL)       ALL'
        insertafter: '^%wheel'

    - name: Allow the {{ ansible_hostname }} USER AD group to logon to the system
      command: /bin/bash -c "/usr/sbin/realm permit -g LINUX-USER@<active_directory>"


    - name: Restart service realmd
      service:
        name: realmd
        state: restarted

    - name: restart sssd
      service:
        name: sssd
        state: restarted

    - name: restart systemd-logind
      service:
        name: systemd-logind
        state: restarted