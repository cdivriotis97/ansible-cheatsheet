- hosts: localhost
  become_method: sudo
  become: false
  collections:
    - community.vmware
  pre_tasks:
    - include_vars: ./vars/settings.yml
  vars:
    ansible_python_interpreter: /usr/bin/python3

  vars_prompt:
    - name: "vm_name"
      prompt: "vm_name"
      private: no
    - name: "cpu_number"
      prompt: "Number of CPUs"
      private: no
    - name: "vcenter_username"
      prompt: "vcenter_username"
      private: no
    - name: "vcenter_password"
      prompt: "vcenter_password"
      private: yes
      
  tasks:

    - name: "Get VM info" 
      community.vmware.vmware_guest_info: 
        hostname: "{{ vcenter_hostname }}" 
        username: "{{ vcenter_username }}" 
        password: "{{ vcenter_password }}" 
        validate_certs: "{{ vcenter_validate_certs }}" 
        datacenter: "{{ vcenter_datacenter }}" 
        name: "{{ vm_name }}" 
      register: vm_info 
      delegate_to: localhost 
      connection: local 
    
    - name: "Raise cpu number for a VM" 
      community.vmware.vmware_guest: 
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        datacenter: "{{ vcenter_datacenter }}"
        validate_certs: False 
        uuid: "{{ vm_info.instance.hw_product_uuid }}" 
        hardware: 
          num_cpus: "{{ cpu_number|int }}" 
      when: (cpu_number|int) > vm_info.instance.hw_processor_count 
      delegate_to: "localhost" 
      connection: local 
    
    - name: "Requested number of CPUs should be grater than existent" 
      debug: 
        msg: "Requested number of CPUs should be grater than existent ( {{ (cpu_number|int) }} <= {{ vm_info.instance.hw_processor_count }} !)"
      when: (cpu_number|int) <= vm_info.instance.hw_processor_count
