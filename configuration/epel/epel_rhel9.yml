---
- name: EPEL 9 RHEL 9
  hosts: all
  become: yes
  become_method: sudo

  tasks:

    - name: Install the EPEL Package RHEL
      yum:
        name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
        state: present
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9'
      environment:
        https_proxy: http://192.168.71.36:8585