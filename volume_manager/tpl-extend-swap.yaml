---
- hosts: all
  become: yes
  become_method: sudo

  tasks:

   - name: list all the scsi hosts for block storage
     find:
       paths: /sys/class/scsi_disk/
       file_type: link
     register: result_scsi_disk

   - name: rescan block storage
     shell: 'echo "- - -" > {{item}}/device/rescan'
     loop: "{{result_scsi_disk.files| map(attribute='path')| list}}"
     ignore_errors: yes          
   - name: Extend Partition sda2 RHEL 7
     shell:
       /bin/echo -e "d\n2\nn\np\n2\n\n\nt\n2\n8e\nw" | sudo fdisk /dev/sda
     ignore_errors: yes
     when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '7'

   - name: Extend Partition sda3 RHEL 8 / 9
     shell:
       /bin/echo -e "d\n3\nn\np\n3\n\n\nt\n3\n8e\nw" | sudo fdisk /dev/sda
     ignore_errors: yes
     when: (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8' ) or (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9')

   - name: PartX sda2 RHEL7
     shell:
       partx -v -u /dev/sda2
     when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '7'

   - name: PartX sda2 RHEL 8 / 9 
     shell:
       partx -v -u /dev/sda3
     when: (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8' ) or (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9')

   - name: Pvresize RHEL7
     shell:
       pvresize /dev/sda2
     when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '7'

   - name: Pvresize sda3 RHEL 8 / 9
     shell:
       pvresize /dev/sda3
     when: (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8') or (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9') 

   - name: Swapoff
     shell: swapoff -v /dev/rhel/swap

   - name: Extend LVM file system.
     shell: lvm lvresize /dev/rhel/swap -l +100%free

   - name: Format Partition
     shell: mkswap  /dev/rhel/swap

   - name: Put Swap ON
     shell: swapon -va       
