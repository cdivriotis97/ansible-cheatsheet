---
- hosts: all
  become_method: sudo

  tasks:
   - name: rescanning for new disks
     shell: echo '1' > /sys/class/scsi_disk/0\:0\:0\:0/device/rescan
     ignore_errors: yes

   - name: rescanning for new disks
     shell: echo '1' > /sys/class/scsi_disk/2:0\:0\:0/device/rescan
     ignore_errors: yes

   - name: Extend Partition sda2 RHEL 7
     shell:
       /bin/echo -e "d\n2\nn\np\n2\n\n\nt\n2\n8e\nw" | sudo fdisk /dev/sda
     ignore_errors: yes
     when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '7'

   - name: Extend Partition sda3 RHEL 8 / 9
     shell:
       /bin/echo -e "d\n3\nn\np\n3\n\n\nt\n3\n8e\nw" | sudo fdisk /dev/sda
     ignore_errors: yes
     when: (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8' and ansible_virtualization_type == 'VMware' ) or (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9' and ansible_virtualization_type == 'VMware') 

   - name: PartX sda2 RHEL7
     shell:
       partx -v -u /dev/sda2
     when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '7'

   - name: PartX sda2 RHEL 8 / 9
     shell:
       partx -v -u /dev/sda3
     when: (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8' and ansible_virtualization_type == 'VMware' ) or (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9' and ansible_virtualization_type == 'VMware')

   - name: Pvresize RHEL7
     shell:
       pvresize /dev/sda2
     when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '7'

   - name: Pvresize sda3 RHEL 8 / 9
     shell:
       pvresize /dev/sda3
     when: (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8' and ansible_virtualization_type == 'VMware' ) or (ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9' and ansible_virtualization_type == 'VMware') 

   - name: Extend LVM   file system.
     shell: lvextend -r -l +100%free /dev/mapper/rhel-root
