- hosts: all
  become_method: sudo
  become: true
  become_user: root
  vars_files:
    - vars/settings.yml   #global variables
  vars:
    proxy_env:
      http_proxy: http://<PROXY_URL>:<PROXY_PORT>

  tasks:

    - name: Install the Zabbix Agent from a remote repo
      yum:
        name:  http://repo.zabbix.com/zabbix/6.0/rhel/7/x86_64/zabbix-agent2-6.0.7-1.el7.x86_64.rpm 
        state: present
      environment: "{{proxy_env}}"
      when: ansible_distribution == 'CentOS' and ansible_distribution_major_version == '7'

    - name: Install the Zabbix Agent from a remote repo
      yum:
        name:  http://repo.zabbix.com/zabbix/6.0/rhel/7/x86_64/zabbix-agent2-6.0.7-1.el7.x86_64.rpm 
        state: present
      environment: "{{proxy_env}}"
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '7'

    - name: Install the Zabbix Agent from a remote repo
      yum:
        name: http://repo.zabbix.com/zabbix/6.0/rhel/8/x86_64/zabbix-agent2-6.0.7-1.el8.x86_64.rpm 
        state: present
      environment: "{{proxy_env}}"
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '8'

    - name: Install the Zabbix Agent from a remote repo
      yum:
        name: http://repo.zabbix.com/zabbix/6.0/rhel/9/x86_64/zabbix-agent2-6.0.7-1.el9.x86_64.rpm 
        state: present
      environment: "{{proxy_env}}"
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version == '9'

    - name: Zabbix Agent configuration file update
      template: 
        src: ./templates/zabbix_agentdv6.conf.j2
        dest: /etc/zabbix/zabbix_agentd.conf

    - name: Start Zabbix Agent Service
      systemd:
        state: restarted
        name: zabbix-agent
        enabled: yes

    - name: Add Zabbix Agent to Firewalld Rules
      firewalld:
        port: 10050/tcp
        permanent: true
        state: enabled

    - name: Restart FW Service
      systemd:
        state: restarted
        name: firewalld
    - name: Install yum-versionlock
      yum:
        name: yum-plugin-versionlock
        state: present
      when: (ansible_distribution == 'RedHat' or ansible_distribution == 'CentOS') and ansible_distribution_major_version == '7'
      ignore_errors: true

    - name: Install yum-versionlock 
      yum:
        name: python3-dnf-plugin-versionlock
        state: present
      when: ansible_distribution == 'RedHat' and (ansible_distribution_major_version == '8' or ansible_distribution_major_version == '9')
      ignore_errors: true


    - name : Prevent package for being updated
      command: yum versionlock zabbix-agent.x86_64